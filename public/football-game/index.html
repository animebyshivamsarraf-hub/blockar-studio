<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Football Basket Shootout — 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0b1020; font-family:'Segoe UI',system-ui,sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  #game { position:fixed; inset:0; }
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:14px 16px; pointer-events:none; z-index:10; }
  .pill { background:rgba(10,15,30,.62); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.14); color:#fff; border-radius:999px; padding:8px 16px; font-size:15px; font-weight:700; letter-spacing:.4px; box-shadow:0 4px 18px rgba(0,0,0,.35); }
  .pill small { font-weight:400; opacity:.75; font-size:11px; display:block; letter-spacing:1.2px; text-transform:uppercase; }
  #streak { color:#ffd54a; }
  #msg { position:fixed; top:22%; left:0; right:0; text-align:center; z-index:10; pointer-events:none; opacity:0; transition:opacity .3s; }
  #msg.show { opacity:1; }
  #msg .big { font-size:44px; font-weight:900; color:#fff; text-shadow:0 4px 24px rgba(0,0,0,.6), 0 0 40px rgba(255,213,74,.5); letter-spacing:1px; }
  #msg .sub { font-size:16px; color:#cfe3ff; margin-top:6px; font-weight:600; }
  #hint { position:fixed; bottom:26px; left:0; right:0; text-align:center; z-index:10; pointer-events:none; }
  #hint span { background:rgba(10,15,30,.6); backdrop-filter:blur(8px); color:#eaf2ff; border:1px solid rgba(255,255,255,.12); padding:10px 20px; border-radius:999px; font-size:14px; font-weight:600; display:inline-block; animation:bob 2s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  #hint.hide { display:none; }
  #resetBtn { position:fixed; bottom:22px; right:16px; z-index:11; width:52px; height:52px; border-radius:50%; border:1px solid rgba(255,255,255,.18); background:rgba(10,15,30,.66); backdrop-filter:blur(8px); color:#fff; font-size:22px; cursor:pointer; box-shadow:0 4px 18px rgba(0,0,0,.4); }
  #resetBtn:active { transform:scale(.92); }
  #power { position:fixed; right:18px; top:50%; transform:translateY(-50%); width:10px; height:180px; border-radius:6px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.15); z-index:10; overflow:hidden; pointer-events:none; }
  #powerFill { position:absolute; bottom:0; left:0; right:0; height:0%; background:linear-gradient(to top,#37e08b,#ffd54a 60%,#ff5a5a); border-radius:6px; transition:height .05s; }
  #wind { position:fixed; top:76px; left:0; right:0; text-align:center; z-index:10; pointer-events:none; font-size:15px; font-weight:700; color:#9fd8ff; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  #target { position:fixed; top:102px; left:0; right:0; text-align:center; z-index:10; pointer-events:none; font-size:12px; font-weight:600; color:#ffd54a; text-shadow:0 2px 8px rgba(0,0,0,.6); letter-spacing:.5px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

} }
</script>

<body>
<div id="game"></div>
<div id="hud">
  <div class="pill"><small>Level</small><span id="level">1</span></div>
  <div class="pill"><small>Score</small><span id="score">0</span></div>
  <div class="pill"><small>Streak</small><span id="streak">🔥 0</span></div>
  <div class="pill"><small>Shots</small><span id="shots">0</span></div>
</div>
<div id="wind"></div>
<div id="target"></div>
<div id="msg"><div class="big"></div><div class="sub"></div></div>
<div id="hint"><span>👆 Drag down for power, left/right to aim — release to shoot!</span></div>
<div id="power"><div id="powerFill"></div></div>
<button id="resetBtn" title="Reset ball">↺</button>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ============ RENDERER / SCENE ============ */
const container = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 30, 90);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
const CAM_POS = new THREE.Vector3(0, 3.4, 9.5);
const CAM_LOOK = new THREE.Vector3(0, 2.2, -6);
camera.position.copy(CAM_POS);
camera.lookAt(CAM_LOOK);

/* ============ LIGHTS ============ */
scene.add(new THREE.HemisphereLight(0xbdd7ff, 0x1a2038, 0.75));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.position.set(8, 16, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -15; sun.shadow.camera.right = 15;
sun.shadow.camera.top = 15; sun.shadow.camera.bottom = -15;
scene.add(sun);
const rimLight = new THREE.DirectionalLight(0x6aa8ff, 0.5);
rimLight.position.set(-8, 6, -10);
scene.add(rimLight);
// stadium glow spots
[[0,9,-14,0xffffff],[-10,8,-6,0x88bbff],[10,8,-6,0xffcc88]].forEach(([x,y,z,c])=>{
  const s = new THREE.SpotLight(c, 350, 60, Math.PI/5, 0.5);
  s.position.set(x,y,z); s.target.position.set(0,0,-6); scene.add(s, s.target);
});

/* ============ STADIUM BACKDROP ============ */
function makeGlowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64,64,4,64,64,64);
  grd.addColorStop(0,'rgba(255,255,255,1)'); grd.addColorStop(0.4,'rgba(255,255,255,.35)'); grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const glowTex = makeGlowTexture();
// crowd dots
{
  const c = document.createElement('canvas'); c.width=512; c.height=128;
  const g = c.getContext('2d');
  g.fillStyle='#101528'; g.fillRect(0,0,512,128);
  for(let i=0;i<900;i++){
    g.fillStyle=`hsl(${Math.random()*360},60%,${35+Math.random()*35}%)`;
    g.fillRect(Math.random()*512, Math.random()*128, 3, 4);
  }
  const tex = new THREE.CanvasTexture(c);
  const crowd = new THREE.Mesh(
    new THREE.CylinderGeometry(26, 26, 10, 32, 1, true, 0, Math.PI),
    new THREE.MeshBasicMaterial({ map:tex, side:THREE.BackSide })
  );
  crowd.position.set(0, 7, -8); crowd.rotation.y = Math.PI/2;
  scene.add(crowd);
}

/* ============ COURT ============ */
const COURT_W = 14, COURT_L = 30;
{
  const c = document.createElement('canvas'); c.width = 512; c.height = 1024;
  const g = c.getContext('2d');
  // wood
  const wood = g.createLinearGradient(0,0,512,0);
  wood.addColorStop(0,'#b07a3e'); wood.addColorStop(.5,'#c08a48'); wood.addColorStop(1,'#a96f36');
  g.fillStyle = wood; g.fillRect(0,0,512,1024);
  for(let i=0;i<512;i+=8){ g.fillStyle='rgba(0,0,0,.05)'; g.fillRect(i,0,2,1024); }
  // painted key area
  g.fillStyle = 'rgba(30,80,180,.55)'; g.fillRect(156, 700, 200, 324);
  g.strokeStyle = '#f5f5f5'; g.lineWidth = 6;
  g.strokeRect(156, 700, 200, 324);
  g.beginPath(); g.arc(256, 700, 90, 0, Math.PI); g.stroke();
  g.beginPath(); g.arc(256, 512, 120, 0, Math.PI*2); g.stroke();
  g.beginPath(); g.moveTo(0,512); g.lineTo(512,512); g.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const court = new THREE.Mesh(
    new THREE.BoxGeometry(COURT_W, 0.2, COURT_L),
    new THREE.MeshStandardMaterial({ map:tex, roughness:.7 })
  );
  court.position.set(0, -0.1, -6);
  court.receiveShadow = true;
  scene.add(court);
  // surrounding dark floor
  const outer = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshStandardMaterial({ color:0x0d1226, roughness:1 })
  );
  outer.rotation.x = -Math.PI/2; outer.position.y = -0.21;
  scene.add(outer);
}

/* ============ HOOP (basket) ============ */
const HOOP = { x:0, rimY:3.05, z:-13, rimR:0.42, boardZ:-13.45 };
const hoopGroup = new THREE.Group();
{
  const steel = new THREE.MeshStandardMaterial({ color:0x8a93a6, metalness:.8, roughness:.35 });
  // pole
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.15,3.9,16), steel);
  pole.position.set(HOOP.x, 1.95, HOOP.z - 1.1); pole.castShadow = true; hoopGroup.add(pole);
  // arm
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.16,0.16,1.2), steel);
  arm.position.set(HOOP.x, 3.6, HOOP.z - 0.55); hoopGroup.add(arm);
  // backboard (transparent)
  const board = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 1.05, 0.06),
    new THREE.MeshPhysicalMaterial({ color:0xcfe8ff, transparent:true, opacity:0.35, roughness:.1, metalness:0 })
  );
  board.position.set(HOOP.x, 3.55, HOOP.boardZ); board.castShadow = true; hoopGroup.add(board);
  const frame = new THREE.Mesh(new THREE.BoxGeometry(1.86,1.11,0.03),
    new THREE.MeshStandardMaterial({ color:0xd23c3c, roughness:.5 }));
  frame.position.set(HOOP.x, 3.55, HOOP.boardZ - 0.035); hoopGroup.add(frame);
  // rim
  const rim = new THREE.Mesh(new THREE.TorusGeometry(HOOP.rimR, 0.028, 12, 32),
    new THREE.MeshStandardMaterial({ color:0xe8641e, metalness:.6, roughness:.4 }));
  rim.rotation.x = Math.PI/2;
  rim.position.set(HOOP.x, HOOP.rimY, HOOP.z); rim.castShadow = true; hoopGroup.add(rim);
  // net — criss-cross lines
  const netMat = new THREE.LineBasicMaterial({ color:0xf2f2f2, transparent:true, opacity:.85 });
  const pts = [];
  const N = 12, topR = HOOP.rimR, botR = 0.13, h = 0.42;
  for(let i=0;i<N;i++){
    const a1 = i/N*Math.PI*2, a2 = (i+1)/N*Math.PI*2;
    pts.push(new THREE.Vector3(HOOP.x+Math.cos(a1)*topR, HOOP.rimY, HOOP.z+Math.sin(a1)*topR));
    pts.push(new THREE.Vector3(HOOP.x+Math.cos(a2)*botR, HOOP.rimY-h, HOOP.z+Math.sin(a2)*botR));
    pts.push(new THREE.Vector3(HOOP.x+Math.cos(a2)*topR, HOOP.rimY, HOOP.z+Math.sin(a2)*topR));
    pts.push(new THREE.Vector3(HOOP.x+Math.cos(a1)*botR, HOOP.rimY-h, HOOP.z+Math.sin(a1)*botR));
  }
  const netGeo = new THREE.BufferGeometry().setFromPoints(pts);
  hoopGroup.add(new THREE.LineSegments(netGeo, netMat));
  // glow ring under rim for style
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, color:0xff9a3c, transparent:true, opacity:.35, depthWrite:false }));
  glow.scale.set(1.6,1.6,1); glow.position.set(HOOP.x, HOOP.rimY, HOOP.z);
  hoopGroup.add(glow);
}
scene.add(hoopGroup);

/* ============ FOOTBALL (soccer ball texture) ============ */
function soccerTexture(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#f4f4f4'; g.fillRect(0,0,512,256);
  g.fillStyle = '#1a1a1a';
  // rows of pentagons (stylised)
  for(let row=0; row<4; row++){
    for(let col=0; col<8; col++){
      const x = col*64 + (row%2? 32:0), y = row*64 + 32;
      g.beginPath();
      for(let k=0;k<5;k++){
        const a = k/5*Math.PI*2 - Math.PI/2;
        const px = x + Math.cos(a)*20, py = y + Math.sin(a)*20;
        k? g.lineTo(px,py) : g.moveTo(px,py);
      }
      g.closePath(); g.fill();
    }
  }
  g.strokeStyle = '#1a1a1a'; g.lineWidth = 3;
  for(let i=0;i<9;i++){ g.beginPath(); g.moveTo(i*64,0); g.lineTo(i*64,256); g.stroke(); }
  return new THREE.CanvasTexture(c);
}
const BALL_R = 0.24;
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(BALL_R, 32, 24),
  new THREE.MeshStandardMaterial({ map:soccerTexture(), roughness:.55 })
);
ball.castShadow = true;
scene.add(ball);
// ball glow trail
const trail = [];
const trailMat = new THREE.MeshBasicMaterial({ color:0x6ac8ff, transparent:true, opacity:.5 });

/* ============ PLAYER (3D scan character + procedural lower body) ============ */
const player = new THREE.Group();
const playerInner = new THREE.Group();   // lean/bob animation goes here
player.add(playerInner);
let charLoaded = false;

function buildFallbackPlayer(){
  const skin = new THREE.MeshStandardMaterial({ color:0xd9a066, roughness:.7 });
  const shirt = new THREE.MeshStandardMaterial({ color:0x2277dd, roughness:.7 });
  const pants = new THREE.MeshStandardMaterial({ color:0x1c2340, roughness:.8 });
  const shoe = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:.6 });
  const add = (geo, mat, x,y,z)=>{ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.castShadow=true; playerInner.add(m); return m; };
  add(new THREE.CapsuleGeometry(0.16,0.5,6,12), pants, -0.13, 0.55, 0);
  add(new THREE.CapsuleGeometry(0.16,0.5,6,12), pants,  0.13, 0.55, 0);
  add(new THREE.BoxGeometry(0.2,0.12,0.34), shoe, -0.13, 0.07, 0.06);
  add(new THREE.BoxGeometry(0.2,0.12,0.34), shoe,  0.13, 0.07, 0.06);
  add(new THREE.CapsuleGeometry(0.24,0.45,6,12), shirt, 0, 1.25, 0);
  add(new THREE.SphereGeometry(0.17,20,16), skin, 0, 1.85, 0);
  const armL = add(new THREE.CapsuleGeometry(0.09,0.42,6,10), shirt, -0.36, 1.3, 0.1);
  const armR = add(new THREE.CapsuleGeometry(0.09,0.42,6,10), shirt,  0.36, 1.3, 0.1);
  armL.rotation.z =  0.5; armR.rotation.z = -0.5; armL.rotation.x = armR.rotation.x = -0.7;
  playerInner.userData.arms = [armL, armR];
}

function buildLowerBody(){
  // kurta-pajama lower body to complete the scanned bust (orange kurta)
  const kurta = new THREE.MeshStandardMaterial({ color:0xe8721c, roughness:.85 });
  const pajama = new THREE.MeshStandardMaterial({ color:0xf2ede2, roughness:.9 });
  const shoeM = new THREE.MeshStandardMaterial({ color:0x4a3220, roughness:.7 });
  const add = (geo, mat, x,y,z)=>{ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.castShadow=true; playerInner.add(m); return m; };
  add(new THREE.CylinderGeometry(0.30, 0.37, 0.5, 18), kurta, 0, 0.62, 0);       // kurta skirt
  add(new THREE.CapsuleGeometry(0.11,0.34,4,10), pajama, -0.13, 0.27, 0);        // pajama legs
  add(new THREE.CapsuleGeometry(0.11,0.34,4,10), pajama,  0.13, 0.27, 0);
  add(new THREE.BoxGeometry(0.16,0.1,0.3), shoeM, -0.13, 0.05, 0.05);            // shoes
  add(new THREE.BoxGeometry(0.16,0.1,0.3), shoeM,  0.13, 0.05, 0.05);
}

buildLowerBody();
// try local model first (permanent), then hosted copy
const CHAR_URLS = [
  '/models/character.glb',
  'https://muse.ai/files/1309069215631594/1462915465938091/oprmaaxn1xwwbed5ts7jv6vz/character_small.glb'
];
function tryLoadChar(i){
  if(i >= CHAR_URLS.length){ buildFallbackPlayer(); return; }
  new GLTFLoader().load(CHAR_URLS[i],
    (gltf)=>{
      const model = gltf.scene;
      // scan: y in [-1.0, 0.96] (head+torso), face toward -z. Scale so bust ~= 0.95m.
      const s = 0.485;
      model.scale.setScalar(s);
      model.rotation.y = Math.PI;              // face -> +z (player forward)
      model.position.y = 0.85 + 1.0*s;         // waist sits at hip height
      model.traverse(o=>{ if(o.isMesh) o.castShadow = true; });
      playerInner.add(model);
      charLoaded = true;
    },
    undefined,
    ()=>tryLoadChar(i+1)                        // next URL or fallback
  );
}
tryLoadChar(0);
const SHOOT_SPOTS = [ {x:0,z:-5.5}, {x:-2.5,z:-6.5}, {x:2.5,z:-8}, {x:0,z:-9.5} ];
let spotIdx = 0;
function placePlayer(){
  const s = SHOOT_SPOTS[spotIdx % SHOOT_SPOTS.length];
  player.position.set(s.x, 0, s.z);
  player.lookAt(HOOP.x, 0, HOOP.z);
}
placePlayer();
scene.add(player);

/* ============ GAME STATE ============ */
const G = 12.5;
let score=0, shots=0, streak=0, best=0;
let level=1, basketsThisLevel=0, wind=0;
let ballState = 'held';           // held | flying | scored | dead
let vel = new THREE.Vector3();
let spin = new THREE.Vector3();
let aiming = false, aimStart = null, aimVec = new THREE.Vector3();
let scoredThisFlight = false;
let prevY = 0;

const scoreEl = document.getElementById('score'), streakEl = document.getElementById('streak'),
      shotsEl = document.getElementById('shots'), msgEl = document.getElementById('msg'),
      hintEl = document.getElementById('hint'), powerFill = document.getElementById('powerFill'),
      levelEl = document.getElementById('level'), windEl = document.getElementById('wind'),
      targetEl = document.getElementById('target');

function basketsNeeded(){ return 2 + Math.floor((level-1)/2); }
function setWind(harder=false){
  if(level < 3 && !harder){ wind = 0; }
  else { wind = (Math.random()*2-1) * (1 + (level-3)*0.5 + (harder?0.5:0)); wind = Math.round(wind*10)/10; }
  updateWindUI();
}
function updateWindUI(){
  if(wind === 0){ windEl.textContent = ''; }
  else {
    const arrow = wind > 0 ? '→' : '←';
    windEl.textContent = `💨 Wind ${arrow} ${Math.abs(wind).toFixed(1)}`;
  }
  targetEl.textContent = `🎯 ${basketsThisLevel}/${basketsNeeded()} baskets to Level ${level+1}`;
}
function updateHUD(){
  levelEl.textContent = level;
  scoreEl.textContent = score;
  updateWindUI();
}

function showMsg(big, sub, ms=1400){
  msgEl.querySelector('.big').textContent = big;
  msgEl.querySelector('.sub').textContent = sub;
  msgEl.classList.add('show');
  clearTimeout(showMsg.t);
  showMsg.t = setTimeout(()=>msgEl.classList.remove('show'), ms);
}

/* ============ SOUND (synth) ============ */
let AC = null;
function beep(freq, dur=0.12, type='sine', vol=0.25){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g).connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}
const sndBounce = ()=>beep(160+Math.random()*60, .09, 'triangle', .18);
const sndSwish  = ()=>{ beep(880,.12,'sine',.2); setTimeout(()=>beep(1320,.18,'sine',.2),90); };
const sndScore  = ()=>{ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15,'sine',.22), i*90)); };
const sndThrow  = ()=>beep(300,.08,'sawtooth',.08);

/* ============ BALL PLACEMENT ============ */
const holdOffset = new THREE.Vector3(0, 1.45, 0.45);
function resetBall(){
  ballState = 'held';
  scoredThisFlight = false;
  const p = new THREE.Vector3(); player.getWorldPosition(p);
  const fwd = new THREE.Vector3(); player.getWorldDirection(fwd);
  ball.position.copy(p).addScaledVector(fwd, 0.45).add(new THREE.Vector3(0,1.45,0));
  vel.set(0,0,0);
  clearTrajectory();
  trail.forEach(t=>scene.remove(t)); trail.length = 0;
}

/* ============ TRAJECTORY PREVIEW ============ */
let trajLine = null;
function showTrajectory(v0){
  clearTrajectory();
  const pts = [];
  const p = ball.position.clone(), v = v0.clone();
  const dt = 1/30;
  for(let i=0;i<45;i++){
    v.y -= G*dt; v.x += wind*dt;
    p.addScaledVector(v, dt);
    if(p.y < BALL_R) break;
    pts.push(p.clone());
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  trajLine = new THREE.Line(geo, new THREE.LineDashedMaterial({ color:0x7fd0ff, dashSize:.18, gapSize:.12, transparent:true, opacity:.9 }));
  trajLine.computeLineDistances();
  scene.add(trajLine);
}
function clearTrajectory(){ if(trajLine){ scene.remove(trajLine); trajLine.geometry.dispose(); trajLine = null; } }

/* ============ INPUT (drag to aim) ============ */
const ray = new THREE.Raycaster();
function ndc(e){ return new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1); }

addEventListener('pointerdown', e=>{
  if(ballState !== 'held') return;
  aiming = true; aimStart = { x:e.clientX, y:e.clientY };
  hintEl.classList.add('hide');
});
addEventListener('pointermove', e=>{
  if(!aiming || ballState !== 'held') return;
  const dxPx = e.clientX - aimStart.x;
  const dyPx = e.clientY - aimStart.y;
  // SLINGSHOT: pull DOWN (or push UP) to charge power — both directions work,
  // so the ball never gets stuck on a weak fixed shot.
  const pull = Math.abs(dyPx);
  const power = THREE.MathUtils.clamp(pull / (innerHeight*0.38), 0, 1);
  // STEER: drag LEFT / RIGHT to aim sideways
  const steer = THREE.MathUtils.clamp(dxPx / (innerWidth*0.25), -1, 1);

  const dir = new THREE.Vector3(HOOP.x - ball.position.x, 0, HOOP.z - ball.position.z).normalize();
  const side = new THREE.Vector3(-dir.z, 0, dir.x);
  const v0 = dir.clone().multiplyScalar(4.5 + power*10.5);
  v0.y = 4 + power*8.5;
  v0.addScaledVector(side, steer * (2.5 + power*6));
  aimVec.copy(v0);
  powerFill.style.height = (power*100)+'%';
  showTrajectory(v0);
});
function release(){
  if(!aiming) return;
  aiming = false;
  powerFill.style.height = '0%';
  clearTrajectory();
  if(ballState !== 'held') return;
  if(aimVec.lengthSq() < 9){ aimVec.set(0,0,0); return; } // just a tap — cancel
  // SMART AIM ASSIST (like real mobile sports games):
  // compute the perfect velocity to hit the hoop, then blend player's aim toward it.
  // Good aims get corrected -> scores feel earned. Wild shots stay wild. Hard stays hard.
  const assist = [0.55, 0.5, 0.4, 0.32, 0.25][Math.min(level-1, 4)];
  const toHoop = new THREE.Vector3(HOOP.x-ball.position.x, 0, HOOP.z-ball.position.z);
  const distH = toHoop.length(); toHoop.normalize();
  const aimDir = aimVec.clone(); aimDir.y = 0; aimDir.normalize();
  if(aimDir.dot(toHoop) > 0.25){
    const T = 0.55 + distH*0.055;                 // ideal flight time
    const ideal = new THREE.Vector3(
      (HOOP.x-ball.position.x)/T,
      ((HOOP.rimY-ball.position.y) + 0.5*G*T*T)/T,
      (HOOP.z-ball.position.z)/T
    );
    vel.copy(aimVec).lerp(ideal, assist);
    vel.x += (Math.random()-0.5)*0.7;             // tiny human wobble
    vel.z += (Math.random()-0.5)*0.7;
  } else {
    vel.copy(aimVec);
  }
  spin.set(Math.random()*8-4, Math.random()*6-3, Math.random()*8-4);
  ballState = 'flying';
  scoredThisFlight = false;
  shots++; shotsEl.textContent = shots;
  sndThrow();
  // player throw animation
  if(charLoaded){
    playerInner.rotation.x = 0.28;
    setTimeout(()=>{ playerInner.rotation.x = 0; }, 380);
  } else {
    (playerInner.userData.arms||[]).forEach(a=>{ a.rotation.x = -2.2; setTimeout(()=>a.rotation.x=-0.7, 350); });
  }
}
addEventListener('pointerup', release);
addEventListener('pointercancel', ()=>{ aiming=false; clearTrajectory(); powerFill.style.height='0%'; });
document.getElementById('resetBtn').addEventListener('click', ()=>{ resetBall(); });

/* ============ PHYSICS ============ */
const tmpV = new THREE.Vector3();
function stepPhysics(dt){
  if(ballState !== 'flying') return;
  prevY = ball.position.y;
  vel.y -= G*dt;
  vel.x += wind*dt;   // wind pushes the ball sideways
  ball.position.addScaledVector(vel, dt);
  ball.rotation.x += spin.x*dt; ball.rotation.y += spin.y*dt; ball.rotation.z += spin.z*dt;

  // trail
  if(Math.random()<0.6){
    const t = new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8), trailMat.clone());
    t.position.copy(ball.position); scene.add(t); trail.push(t);
    if(trail.length>24){ const old=trail.shift(); scene.remove(old); }
  }
  trail.forEach(t=>{ t.material.opacity *= 0.94; t.scale.multiplyScalar(0.96); });

  const p = ball.position;

  // ground bounce
  if(p.y < BALL_R){
    p.y = BALL_R;
    if(Math.abs(vel.y) > 1.2){ vel.y *= -0.55; vel.x *= 0.8; vel.z *= 0.8; sndBounce(); }
    else { vel.set(0,0,0); ballState='dead'; setTimeout(nextShot, 700); }
  }
  // backboard bounce (plane at boardZ, within board rect)
  if(p.z - BALL_R < HOOP.boardZ + 0.03 && p.z > HOOP.boardZ - 0.4 && vel.z < 0){
    if(Math.abs(p.x-HOOP.x) < 0.95 && p.y > 3.0 && p.y < 4.1){
      p.z = HOOP.boardZ + 0.03 + BALL_R;
      vel.z *= -0.55; vel.x *= 0.85; vel.y *= 0.9;
      sndBounce();
    }
  }
  // rim magnetism (subtle aim assist): a well-aimed descending ball near the rim
  // gets gently pulled toward center — near misses rattle IN instead of out.
  // Still hard: off-target shots get no help.
  {
    const dxm = p.x - HOOP.x, dzm = p.z - HOOP.z;
    const distXZ = Math.hypot(dxm, dzm);
    const dym = p.y - HOOP.rimY;
    if(vel.y < 0 && dym > 0 && dym < 1.3 && distXZ < 1.0 && distXZ > 0.04){
      const pull = 2.6 * dt * (1 - distXZ/1.0);
      vel.x -= (dxm/distXZ) * pull;
      vel.z -= (dzm/distXZ) * pull;
    }
  }
  // rim bounce — ring at (HOOP.x, rimY, HOOP.z). Deadened so good shots drop.
  {
    const dx = p.x - HOOP.x, dz = p.z - HOOP.z;
    const distXZ = Math.hypot(dx, dz);
    const dy = p.y - HOOP.rimY;
    if(Math.abs(distXZ - HOOP.rimR) < BALL_R + 0.03 && Math.abs(dy) < BALL_R + 0.03){
      // push away from rim tube, but softly — keeps "rattle in" alive
      const nx = dx/(distXZ||1), nz = dz/(distXZ||1);
      const dot = vel.x*nx + vel.z*nz;
      vel.x -= 1.15*dot*nx; vel.z -= 1.15*dot*nz;
      vel.y = vel.y*0.25 + 0.7;
      p.x = HOOP.x + nx*(HOOP.rimR + (distXZ>HOOP.rimR? BALL_R+0.035 : -(BALL_R+0.035)));
      p.z = HOOP.z + nz*(HOOP.rimR + (distXZ>HOOP.rimR? BALL_R+0.035 : -(BALL_R+0.035)));
      sndBounce();
    }
  }
  // SCORE — ball passes down through hoop
  if(!scoredThisFlight && prevY > HOOP.rimY && p.y <= HOOP.rimY && vel.y < 0){
    const d = Math.hypot(p.x-HOOP.x, p.z-HOOP.z);
    if(d < HOOP.rimR*0.85){
      scoredThisFlight = true;
      onScore();
    }
  }
  // out of bounds / too long
  if(p.z < -25 || p.z > 12 || Math.abs(p.x) > 18 || (ballState==='flying' && vel.lengthSq()<0.01 && p.y<=BALL_R+0.01)){
    if(!scoredThisFlight){ ballState='dead'; setTimeout(nextShot, 600); }
  }
}

function onScore(){
  score += 2 + Math.min(streak, 5) + (level-1);
  streak++;
  scoreEl.textContent = score;
  streakEl.textContent = '🔥 ' + streak;
  sndSwish(); setTimeout(sndScore, 120);
  const msgs = ['SWISH! 🏀','BUCKET! 🔥','NAILED IT! ⚽','UNSTOPPABLE! 💥','PURE! ✨'];
  showMsg(msgs[Math.min(streak-1, msgs.length-1)], streak>1 ? streak+' in a row!' : '+'+(2+Math.min(streak-1,5))+' points');
  // net ripple effect
  hoopGroup.scale.set(1.06,0.94,1.06);
  setTimeout(()=>hoopGroup.scale.set(1,1,1), 220);
  // confetti burst
  burst(ball.position);
  ballState = 'scored';
  setTimeout(nextShot, 1100);
}

function nextShot(){
  if(ballState==='flying') return;
  if(scoredThisFlight){
    basketsThisLevel++;
    if(basketsThisLevel >= basketsNeeded()){
      basketsThisLevel = 0;
      if(spotIdx < SHOOT_SPOTS.length-1){
        spotIdx++;
        level = spotIdx+1;
        placePlayer();
        setWind();
        updateHUD();
        showMsg('LEVEL '+level+' 📍', 'Further out'+(wind!==0 ? ' + wind! 💨' : ' — good luck!'), 1500);
      } else {
        level++;
        setWind(true);
        updateHUD();
        showMsg('LEVEL '+level+' 📍', 'Wind picking up! 💨', 1500);
      }
    } else {
      updateHUD();
    }
  }
  else {
    if(streak>0) showMsg('MISS', 'Streak reset — next one!', 900);
    streak = 0; streakEl.textContent='🔥 0';
  }
  resetBall();
}

/* confetti */
const confetti = [];
function burst(pos){
  const colors = [0xffd54a,0xff6b6b,0x6ac8ff,0x37e08b,0xc792ea];
  for(let i=0;i<40;i++){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.09,0.09),
      new THREE.MeshBasicMaterial({ color:colors[i%colors.length], side:THREE.DoubleSide }));
    m.position.copy(pos);
    m.userData.v = new THREE.Vector3((Math.random()-.5)*6, Math.random()*6+2, (Math.random()-.5)*6);
    m.userData.r = new THREE.Vector3(Math.random()*8,Math.random()*8,Math.random()*8);
    m.userData.life = 1.4;
    scene.add(m); confetti.push(m);
  }
}
function stepConfetti(dt){
  for(let i=confetti.length-1;i>=0;i--){
    const m = confetti[i];
    m.userData.life -= dt;
    m.userData.v.y -= 9*dt;
    m.position.addScaledVector(m.userData.v, dt);
    m.rotation.x += m.userData.r.x*dt; m.rotation.y += m.userData.r.y*dt;
    if(m.userData.life<=0 || m.position.y<0){ scene.remove(m); confetti.splice(i,1); }
  }
}

/* ============ CAMERA (subtle follow) ============ */
function updateCamera(){
  const target = ballState==='held' ? CAM_POS : new THREE.Vector3(ball.position.x*0.35, 3.6, 9.5);
  camera.position.lerp(target, 0.04);
  camera.lookAt(CAM_LOOK);
}

/* ============ MAIN LOOP ============ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.033);
  if(ballState==='held' && !aiming){
    // gentle idle bob in hands
    const p = new THREE.Vector3(); player.getWorldPosition(p);
    const fwd = new THREE.Vector3(); player.getWorldDirection(fwd);
    ball.position.copy(p).addScaledVector(fwd, 0.45).add(new THREE.Vector3(0, 1.45 + Math.sin(performance.now()*0.003)*0.03, 0));
    ball.rotation.y += dt*0.6;
  }
  stepPhysics(dt);
  stepConfetti(dt);
  updateCamera();
  renderer.render(scene, camera);
}
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

resetBall();
setWind();
updateHUD();
animate();
showMsg('🏀 FOOTBALL BASKET 🏀', 'Drag & release to shoot!', 2200);
</script>
</body>
</html>
