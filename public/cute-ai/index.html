<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Mimi 🤖 — Your AI Companion</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; }
  body { background:#070a18; color:#fff; display:flex; flex-direction:column; }
  /* ambient nebula behind everything */
  #nebula { position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
    radial-gradient(ellipse 70% 40% at 50% 18%, rgba(99,102,241,.22) 0%, transparent 65%),
    radial-gradient(ellipse 45% 30% at 12% 55%, rgba(219,39,119,.10) 0%, transparent 60%),
    radial-gradient(ellipse 45% 30% at 88% 55%, rgba(56,189,248,.10) 0%, transparent 60%); }
  /* ---- header ---- */
  #hdr { z-index:5; display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px 6px; flex-shrink:0; }
  #hdr .name { font-size:19px; font-weight:800;
    background:linear-gradient(90deg,#7dd3fc,#c084fc); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #hdr .sub { font-size:11px; color:rgba(255,255,255,.55); font-weight:400; }
  #online { font-size:12px; background:rgba(74,222,128,.12); border:1px solid rgba(74,222,128,.4);
    color:#4ade80; padding:5px 12px; border-radius:16px; display:flex; align-items:center; gap:6px; }
  #online .dot { width:7px; height:7px; border-radius:50%; background:#4ade80; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  /* ---- 3D stage (dedicated, never overlapped) ---- */
  #stage { z-index:1; position:relative; flex:1 1 auto; min-height:0; }
  #stage canvas { position:absolute; inset:0; width:100% !important; height:100% !important; }
  #stateBar { position:absolute; left:50%; transform:translateX(-50%); bottom:10px; z-index:3;
    display:none; align-items:center; gap:10px; padding:8px 18px; border-radius:24px;
    background:rgba(20,24,60,.78); border:1px solid rgba(139,92,246,.45);
    backdrop-filter:blur(8px); font-size:13px; font-weight:600; white-space:nowrap; }
  #stateBar.show { display:flex; animation:pop .25s ease; }
  #stateBar.error { background:rgba(120,20,20,.8); border-color:rgba(248,113,113,.6); }
  @keyframes pop { from{transform:translateX(-50%) scale(.9);opacity:0} to{transform:translateX(-50%) scale(1);opacity:1} }
  .wave { display:flex; align-items:center; gap:3px; height:20px; }
  .wave span { width:4px; border-radius:3px; background:linear-gradient(#7dd3fc,#c084fc); }
  .wave.play span { animation:wv .7s ease-in-out infinite; }
  .wave.play span:nth-child(1){height:7px} .wave.play span:nth-child(2){height:14px;animation-delay:.12s}
  .wave.play span:nth-child(3){height:20px;animation-delay:.24s} .wave.play span:nth-child(4){height:12px;animation-delay:.36s}
  .wave.play span:nth-child(5){height:7px;animation-delay:.48s}
  @keyframes wv { 0%,100%{transform:scaleY(.4)} 50%{transform:scaleY(1)} }
  .tdots span { display:inline-block; width:6px; height:6px; border-radius:50%; background:#c084fc; margin:0 2px; animation:tblink 1.2s infinite; }
  .tdots span:nth-child(2){animation-delay:.2s} .tdots span:nth-child(3){animation-delay:.4s}
  @keyframes tblink { 0%,100%{opacity:.25;transform:translateY(0)} 50%{opacity:1;transform:translateY(-4px)} }
  /* ---- chat ---- */
  #chatWrap { z-index:5; flex-shrink:0; display:flex; flex-direction:column; max-height:30%; min-height:0;
    border-top:1px solid rgba(139,92,246,.25); background:rgba(8,10,26,.72); backdrop-filter:blur(10px); }
  #msgs { overflow-y:auto; padding:8px 14px; display:flex; flex-direction:column; gap:7px; min-height:44px; }
  .msg { max-width:84%; padding:8px 13px; border-radius:16px; font-size:13.5px; line-height:1.4;
    animation:msgpop .25s ease; word-wrap:break-word; }
  @keyframes msgpop { from{transform:scale(.94);opacity:0} to{transform:scale(1);opacity:1} }
  .msg.ai { align-self:flex-start; background:rgba(139,92,246,.22); border:1px solid rgba(139,92,246,.4); border-bottom-left-radius:5px; }
  .msg.user { align-self:flex-end; background:linear-gradient(135deg,#7c3aed,#4f46e5); border-bottom-right-radius:5px; }
  /* ---- controls ---- */
  #ctrl { z-index:5; flex-shrink:0; display:flex; align-items:center; gap:9px; padding:9px 14px calc(10px + env(safe-area-inset-bottom));
    background:rgba(8,10,26,.92); border-top:1px solid rgba(139,92,246,.18); }
  #micBtn { width:54px; height:54px; border-radius:50%; border:none; cursor:pointer; flex-shrink:0;
    background:linear-gradient(135deg,#f472b6,#a855f7); font-size:24px; color:#fff;
    box-shadow:0 4px 16px rgba(244,114,182,.45); transition:transform .12s; }
  #micBtn:active { transform:scale(.9); }
  #micBtn.listening { animation:micpulse 1s infinite; background:linear-gradient(135deg,#ef4444,#f97316); }
  @keyframes micpulse { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.55)} 50%{box-shadow:0 0 0 14px rgba(239,68,68,0)} }
  #stopBtn { display:none; width:46px; height:46px; border-radius:50%; border:none; cursor:pointer; flex-shrink:0;
    background:linear-gradient(135deg,#ef4444,#f97316); font-size:18px; color:#fff; }
  #stopBtn.show { display:block; }
  #txtIn { flex:1; min-width:0; padding:12px 16px; border-radius:24px; border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08); color:#fff; font-size:14px; outline:none; }
  #txtIn::placeholder { color:rgba(255,255,255,.45); }
  #sendBtn { width:46px; height:46px; border-radius:50%; border:none; cursor:pointer; flex-shrink:0;
    background:linear-gradient(135deg,#38bdf8,#6366f1); font-size:19px; color:#fff; }
  #tabs { z-index:5; flex-shrink:0; display:flex; gap:6px; padding:7px 14px 0; background:rgba(8,10,26,.92); }
  #tabs button { flex:1; padding:8px 0; border-radius:12px; border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05); color:rgba(255,255,255,.7); font-size:12.5px; font-weight:600; cursor:pointer; }
  #tabs button.on { background:linear-gradient(135deg,rgba(168,85,247,.45),rgba(99,102,241,.45)); color:#fff; }
  #settings { z-index:5; flex-shrink:0; display:none; margin:0; padding:10px 16px; font-size:13.5px;
    background:rgba(8,10,26,.95); border-top:1px solid rgba(139,92,246,.25); max-height:38%; overflow-y:auto; }
  #settings.show { display:block; }
  #settings .row { display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.07); }
  #settings .row:last-child { border:none; }
  .tgl { width:48px; height:26px; border-radius:14px; border:none; cursor:pointer; position:relative; background:#3b2a63; transition:background .2s; }
  .tgl.on { background:linear-gradient(135deg,#a855f7,#6366f1); }
  .tgl::after { content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .2s; }
  .tgl.on::after { left:25px; }
  #clearChat { padding:7px 16px; border-radius:10px; border:1px solid rgba(248,113,113,.5); background:rgba(248,113,113,.14); color:#fca5a5; font-size:12.5px; cursor:pointer; }
  input[type=range] { accent-color:#a855f7; width:100px; }
  #keyIn { padding:9px 13px; border-radius:10px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.07); color:#fff; font-size:12.5px; outline:none; width:100%; }
  .keybtns { display:flex; gap:8px; margin-top:8px; }
  .keybtns a, .keybtns button { flex:1; text-align:center; padding:8px; border-radius:10px; font-size:12.5px; font-weight:700; text-decoration:none; cursor:pointer; border:none; color:#fff; }
</style>
<script>
/* boot diagnostic: shows on screen if 3D fails to start */
window.__mimiReady=false;
window.__mimiShowBootErr=function(msg){
  var t=document.getElementById('stateTxt'),b=document.getElementById('stateBar');
  if(t&&b){ t.textContent='⚠️ '+msg; b.classList.add('show','error'); }
};
window.addEventListener('error',function(e){
  if(!window.__mimiReady&&e&&e.message)
    window.__mimiShowBootErr('Error: '+e.message.slice(0,90));
},true);
window.addEventListener('unhandledrejection',function(e){
  if(!window.__mimiReady)
    window.__mimiShowBootErr('Load fail: '+String((e.reason&&e.reason.message)||e.reason||'').slice(0,90));
});
setTimeout(function(){
  if(!window.__mimiReady)
    window.__mimiShowBootErr('3D start nahi hua — net check karo / kuch tabs band karke refresh karo');
},14000);
</script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ================= RENDERER / SCENE ================= */
const stage=document.getElementById('stage');
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x070a18,14,30);
const camera=new THREE.PerspectiveCamera(38,1,.1,100);
camera.position.set(0,1.55,7.4); camera.lookAt(0,1.35,0);
let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
}catch(err){
  window.__mimiShowBootErr('WebGL start nahi hua — kuch tabs band karke page refresh karo 🙏');
  throw err;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
stage.appendChild(renderer.domElement);
function fitStage(){
  const w=stage.clientWidth,h=stage.clientHeight;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h); composer.setSize(w,h);
}
{ const pm=new THREE.PMREMGenerator(renderer);
  scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture; }
scene.add(new THREE.AmbientLight(0x8fa3ff,.65));
const key=new THREE.DirectionalLight(0xffffff,1.0); key.position.set(4,7,6); scene.add(key);
const rimB=new THREE.DirectionalLight(0x38bdf8,.55); rimB.position.set(-6,3,-2); scene.add(rimB);
const rimP=new THREE.DirectionalLight(0xc084fc,.4); rimP.position.set(6,2,-3); scene.add(rimP);
/* subtle bloom — never washes out the face */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(256,256),.32,.55,.82);
composer.addPass(bloom);
composer.addPass(new OutputPass());
/* stars */
{ const g=new THREE.BufferGeometry(),p=[];
  for(let i=0;i<160;i++)p.push((Math.random()-.5)*24,Math.random()*11-1,(Math.random()-.5)*18-4);
  g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x9db8ff,size:.09,transparent:true,opacity:.65}))); }
/* platform */
{ const disc=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.65,.12,40),
    new THREE.MeshStandardMaterial({color:0x111a35,roughness:.5,metalness:.4}));
  disc.position.y=-.06; disc.receiveShadow=true; scene.add(disc);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.5,.035,10,60),
    new THREE.MeshBasicMaterial({color:0x38bdf8,transparent:true,opacity:.8}));
  ring.rotation.x=Math.PI/2; ring.position.y=.02; scene.add(ring);
  const ring2=ring.clone(); ring2.scale.setScalar(.78); ring2.material=ring.material.clone();
  ring2.material.opacity=.35; scene.add(ring2); }

/* ================= LED FACE ================= */
const FC=168;
const faceCanvas=document.createElement('canvas'); faceCanvas.width=faceCanvas.height=FC;
const fx=faceCanvas.getContext('2d'); fx.imageSmoothingEnabled=false;
const faceTex=new THREE.CanvasTexture(faceCanvas);
faceTex.colorSpace=THREE.SRGBColorSpace;
faceTex.magFilter=THREE.NearestFilter; faceTex.minFilter=THREE.NearestFilter;

const Face={
  emotion:'normal', viseme:null, lookX:0, lookY:0, blinkT:2, tearT:0,
  draw(){
    const c=fx,S=FC,E=this.emotion;
    c.clearRect(0,0,S,S);
    c.fillStyle='#04040c'; c.fillRect(0,0,S,S);
    const vg=c.createRadialGradient(S/2,S/2,10,S/2,S/2,S*.75);
    vg.addColorStop(0,'rgba(40,90,160,0.22)'); vg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=vg; c.fillRect(0,0,S,S);
    const blue=E==='angry'?'#ff5a5a':'#6ee7ff';
    const ex1=S*.31+this.lookX*8, ex2=S*.69+this.lookX*8, ey=S*.46+this.lookY*7;
    c.lineCap='round';
    const GE=(fn)=>{ c.save(); c.shadowColor=blue; c.shadowBlur=12; c.fillStyle=blue; c.strokeStyle=blue; fn(); c.restore(); };
    const brow=(x,lift,angry)=>{ c.save(); c.shadowColor=blue; c.shadowBlur=7; c.strokeStyle=blue; c.lineWidth=5;
      c.beginPath();
      if(angry){ c.moveTo(x-16,ey-36+lift); c.lineTo(x+16,ey-24+lift); }
      else c.arc(x,ey-30+lift,17,Math.PI*1.18,Math.PI*1.82);
      c.stroke(); c.restore(); };
    const bl=E==='surprised'?-8:E==='sad'?6:E==='happy'?-4:0;
    if(E!=='sleepy'&&E!=='blink'){ brow(ex1,bl,E==='angry'); brow(ex2,bl,E==='angry'); }
    const ew=30,eh=36;
    if(E==='blink'||E==='sleepy'){
      GE(()=>{ c.lineWidth=7;
        c.beginPath(); c.moveTo(ex1-ew/2,ey); c.quadraticCurveTo(ex1,ey+(E==='sleepy'?10:4),ex1+ew/2,ey); c.stroke();
        c.beginPath(); c.moveTo(ex2-ew/2,ey); c.quadraticCurveTo(ex2,ey+(E==='sleepy'?10:4),ex2+ew/2,ey); c.stroke(); });
    } else if(E==='happy'||E==='laugh'){
      GE(()=>{ c.lineWidth=9;
        c.beginPath(); c.arc(ex1,ey+12,20,Math.PI*1.12,Math.PI*1.88); c.stroke();
        c.beginPath(); c.arc(ex2,ey+12,20,Math.PI*1.12,Math.PI*1.88); c.stroke(); });
    } else if(E==='excited'){
      const star=(x,y,r)=>{ c.beginPath();
        for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;
          c[i?'lineTo':'moveTo'](x+Math.cos(a)*rr,y+Math.sin(a)*rr); }
        c.closePath(); c.fill(); };
      GE(()=>{ star(ex1,ey,24); star(ex2,ey,24); });
    } else if(E==='love'){
      const heart=(x,y,s)=>{ c.beginPath(); c.moveTo(x,y+s*.9);
        c.bezierCurveTo(x-s*1.4,y+s*.1,x-s*.9,y-s*.9,x,y-s*.25);
        c.bezierCurveTo(x+s*.9,y-s*.9,x+s*1.4,y+s*.1,x,y+s*.9); c.fill(); };
      c.save(); c.shadowColor='#ff7ab8'; c.shadowBlur=12; c.fillStyle='#ff8ac2';
      heart(ex1,ey,15); heart(ex2,ey,15); c.restore();
    } else if(E==='sad'){
      GE(()=>{ c.beginPath(); c.ellipse(ex1,ey+4,ew/2,eh/2,0,0,Math.PI*2); c.fill();
        c.beginPath(); c.ellipse(ex2,ey+4,ew/2,eh/2,0,0,Math.PI*2); c.fill(); });
      const ty=(this.tearT*40)%44;
      c.save(); c.shadowColor=blue; c.shadowBlur=9; c.fillStyle=blue;
      for(const tx of [ex1,ex2]){ c.beginPath(); c.ellipse(tx,ey+22+ty,5,8,0,0,Math.PI*2); c.fill();
        c.beginPath(); c.ellipse(tx,ey+20,9,5,0,0,Math.PI*2); c.fill(); }
      c.restore();
    } else if(E==='angry'){
      GE(()=>{ c.beginPath();
        c.moveTo(ex1-16,ey-14); c.lineTo(ex1+16,ey-20); c.lineTo(ex1+14,ey+14);
        c.quadraticCurveTo(ex1,ey+20,ex1-14,ey+14); c.closePath(); c.fill();
        c.beginPath();
        c.moveTo(ex2-16,ey-20); c.lineTo(ex2+16,ey-14); c.lineTo(ex2+14,ey+14);
        c.quadraticCurveTo(ex2,ey+20,ex2-14,ey+14); c.closePath(); c.fill(); });
    } else if(E==='surprised'){
      GE(()=>{ c.lineWidth=8;
        c.beginPath(); c.arc(ex1,ey,20,0,Math.PI*2); c.stroke();
        c.beginPath(); c.arc(ex2,ey,20,0,Math.PI*2); c.stroke();
        c.beginPath(); c.arc(ex1,ey,6,0,Math.PI*2); c.fill();
        c.beginPath(); c.arc(ex2,ey,6,0,Math.PI*2); c.fill(); });
    } else if(E==='thinking'){
      GE(()=>{ c.beginPath(); c.ellipse(ex1-6,ey-8,16,20,0,0,Math.PI*2); c.fill();
        c.beginPath(); c.ellipse(ex2-6,ey-8,16,20,0,0,Math.PI*2); c.fill();
        c.shadowBlur=0; c.fillStyle='#04040c';
        c.beginPath(); c.arc(ex1-2,ey-12,7,0,Math.PI*2); c.fill();
        c.beginPath(); c.arc(ex2-2,ey-12,7,0,Math.PI*2); c.fill(); });
    } else if(E==='wink'){
      GE(()=>{ c.beginPath(); c.ellipse(ex1,ey,ew/2,eh/2,0,0,Math.PI*2); c.fill();
        c.shadowBlur=0; c.fillStyle='#e8fbff'; c.beginPath(); c.arc(ex1+4,ey-6,6,0,Math.PI*2); c.fill();
        c.shadowColor=blue; c.shadowBlur=12; c.strokeStyle=blue; c.lineWidth=8;
        c.beginPath(); c.arc(ex2,ey+6,18,Math.PI*1.15,Math.PI*1.85); c.stroke(); });
    } else {
      GE(()=>{ c.beginPath(); c.ellipse(ex1,ey,ew/2,eh/2,0,0,Math.PI*2); c.fill();
        c.beginPath(); c.ellipse(ex2,ey,ew/2,eh/2,0,0,Math.PI*2); c.fill();
        c.shadowBlur=0; c.fillStyle='#e8fbff';
        c.beginPath(); c.arc(ex1+5,ey-8,7,0,Math.PI*2); c.fill();
        c.beginPath(); c.arc(ex2+5,ey-8,7,0,Math.PI*2); c.fill(); });
    }
    /* mouth */
    const mx=S/2,my=S*.74,V=this.viseme;
    c.save(); c.shadowColor=E==='angry'?'#ff5a5a':'#7dd3fc'; c.shadowBlur=10;
    c.strokeStyle=E==='angry'?'#ff5a5a':'#7dd3fc';
    c.fillStyle=E==='angry'?'#ff5a5a':'#7dd3fc'; c.lineWidth=6;
    if(V){
      if(V==='closed'){ c.beginPath(); c.moveTo(mx-12,my); c.lineTo(mx+12,my); c.stroke(); }
      else if(V==='round'){ c.beginPath(); c.ellipse(mx,my,9,11,0,0,Math.PI*2); c.stroke(); }
      else if(V==='spread'){ c.beginPath(); c.ellipse(mx,my,17,6,0,0,Math.PI*2); c.stroke(); }
      else if(V==='teeth'){ c.beginPath(); c.ellipse(mx,my,12,5,0,0,Math.PI*2); c.stroke(); }
      else { c.beginPath(); c.ellipse(mx,my,12,17,0,0,Math.PI*2); c.fill(); }
    } else if(E==='happy'||E==='excited'||E==='laugh'){

/* ================= ANIMATION STATE MACHINE ================= */
const Anim={
  state:'idle',t:0,tilt:0,tiltT:0,lean:0,leanT:0,waveT:0,
  set(s){ this.state=s; this.t=0; this.tiltT=0; this.leanT=0; this.waveT=0; showSym(null);
    Face.lookY=0;
    if(s==='greeting'||s==='waving'){ Face.emotion='happy'; }
    else if(s==='listening'){ Face.emotion='surprised'; this.leanT=.06; }
    else if(s==='thinking'){ Face.emotion='thinking'; this.tiltT=.2; Face.lookY=-.6; showSym('?'); }
    else if(s==='speaking'){ Face.emotion='normal'; this.leanT=.04; }
    else if(s==='happy'){ Face.emotion='happy'; }
    else if(s==='laugh'){ Face.emotion='laugh'; }
    else if(s==='excited'){ Face.emotion='excited'; showSym('!'); }
    else if(s==='surprised'){ Face.emotion='surprised'; showSym('!'); }
    else if(s==='sad'){ Face.emotion='sad'; this.tiltT=-.12; }
    else if(s==='angry'){ Face.emotion='angry'; this.leanT=.1; }
    else if(s==='sleepy'){ Face.emotion='sleepy'; showSym('z'); }
    else if(s==='love'){ Face.emotion='love'; }
    else if(s==='wink'){ Face.emotion='wink'; }
    else if(s==='music'){ Face.emotion='happy'; showSym('♪'); }
    else if(s==='error'){ Face.emotion='sad'; }
    else { Face.emotion='normal'; }
    Face.draw();
  },
  update(dt,time){
    this.t+=dt;
    const st=this.state;
    /* breathing + hop */
    const hop=(st==='happy'||st==='excited')?Math.abs(Math.sin(this.t*6))*.16:0;
    const sadDip=st==='sad'?-.06:0, sleepDip=st==='sleepy'?-.1:0;
    robot.position.y=Math.sin(time*1.7)*.045+hop+sadDip+sleepDip;
    robot.rotation.y=Math.sin(time*.5)*.1;
    /* head */
    this.tilt+=(this.tiltT-this.tilt)*Math.min(1,dt*5);
    this.lean+=(this.leanT-this.lean)*Math.min(1,dt*5);
    headG.rotation.z=this.tilt+Math.sin(time*1.1)*.025+(st==='sleepy'?Math.sin(time*.9)*.1:0);
    headG.rotation.x=this.lean+(st==='speaking'?Math.sin(time*3.2)*.02:0);
    headG.rotation.y=Math.sin(time*.7)*.08;
    /* torso sway */
    torsoG.rotation.z=Math.sin(time*1.7+1)*.02;
    torsoG.rotation.x=this.lean*.5;
    /* arms */
    if(st==='waving'||st==='greeting'){
      this.waveT+=dt;
      armR.sh.rotation.z=-2.5+Math.sin(this.waveT*9)*.45;
      armR.el.rotation.z=Math.sin(this.waveT*9)*.3;
      if(this.waveT>2.4&&st==='waving'){ this.set('idle'); }
    } else {
      armL.sh.rotation.z=-.18+Math.sin(time*1.7)*.05;
      armR.sh.rotation.z=.18-Math.sin(time*1.7)*.05;
      armL.sh.rotation.x=Math.sin(time*1.3)*.05;
      armR.sh.rotation.x=-Math.sin(time*1.3)*.05;
      armR.el.rotation.z=0;
    }
    if(st==='happy'||st==='excited'){ // cheer: both arms up a bit
      armL.sh.rotation.z=-.7; armR.sh.rotation.z=.7;
    }
    if(st==='sad'){ armL.sh.rotation.z=-.08; armR.sh.rotation.z=.08; }
    /* legs subtle */
    legL.hp.rotation.x=Math.sin(time*1.7)*.03;
    legR.hp.rotation.x=-Math.sin(time*1.7)*.03;
    /* blink + double blink */
    Face.blinkT-=dt;
    if(Face.blinkT<=0&&Face.emotion==='normal'){
      const k=Face.emotion,doB=()=>{ Face.emotion='blink'; Face.draw();
        setTimeout(()=>{Face.emotion=k;Face.draw();},130); };
      doB(); if(Math.random()<.25) setTimeout(doB,280);
      Face.blinkT=2.4+Math.random()*2.6;
    }
    if(st==='idle'&&Math.random()<dt*.3){
      Face.lookX=(Math.random()-.5)*1.1; Face.lookY=(Math.random()-.5)*.5; Face.draw(); }
    if(Face.emotion==='sad'){ Face.tearT+=dt; Face.draw(); }
    if(sym.visible) sym.position.y=3.35+Math.sin(time*3)*.1;
    if(sym2.visible) sym2.position.y=3.4+Math.sin(time*2.2)*.09;
  }
};

/* ================= VISEME LIP-SYNC ================= */
const PHONEME_VIS={
  'अ':'open','आ':'open','ा':'open','ऑ':'open','ॉ':'open',
  'इ':'spread','ई':'spread','ि':'spread','ी':'spread',
  'उ':'round','ऊ':'round','ु':'round','ू':'round',
  'ए':'spread','े':'spread','ऐ':'spread','ै':'spread',
  'ओ':'round','ो':'round','औ':'round','ौ':'round',
  'अं':'open','ं':'open','ँ':'open','ः':'open','ऋ':'spread','ृ':'spread',
  'म':'closed','भ':'closed','ब':'closed','प':'closed',
  'फ':'teeth','व':'teeth','स':'teeth','श':'teeth','ष':'teeth','ज':'teeth','झ':'teeth','च':'teeth','छ':'teeth',
  'a':'open','e':'spread','i':'spread','o':'round','u':'round','y':'spread',
  'm':'closed','b':'closed','p':'closed','f':'teeth','v':'teeth','s':'teeth',
};
function wordViseme(word){
  const w=word.toLowerCase();
  for(const ch of w){ const v=PHONEME_VIS[ch];
    if(v==='open'||v==='round'||v==='spread') return v; }
  for(const ch of w){ const v=PHONEME_VIS[ch]; if(v) return v; }
  return 'open';
}

/* ================= FREE LLM ================= */
const chatHistory=[];
function pushHistory(q,a){ chatHistory.push({role:'user',content:q},{role:'assistant',content:a});
  while(chatHistory.length>8)chatHistory.splice(0,2); }
function getGeminiKey(){ return (localStorage.getItem('mimi_gemini_key')||'').trim(); }
const LLM_SYSTEM='You are Mimi, a cute 3D robot AI friend. Reply in the SAME language as the user (Roman Hindi/Hinglish or English). Be sweet, playful and warm like a close friend. Keep it SHORT - 1 to 2 sentences only, under 40 words. End your reply with exactly one emotion tag: [happy] [sad] [excited] [love] [surprised] [angry] [sleepy] [thinking]';
function parseLLM(out){
  let emotion='happy';
  const m=out.match(/\[(happy|sad|excited|love|surprised|angry|sleepy|thinking|wink|laugh|music)\]\s*$/i);
  if(m){ emotion=m[1].toLowerCase(); out=out.slice(0,m.index).trim(); }
  out=out.trim().replace(/^Mimi:\s*/i,'').slice(0,320);
  if(!out) throw new Error('empty');
  return {text:out,emotion};
}
async function askPollinations(text){
  const msgs=[{role:'system',content:LLM_SYSTEM},
    ...chatHistory.slice(-6).map(m=>({role:m.role==='user'?'user':'assistant',content:m.content})),
    {role:'user',content:text}];
  const ctrl=new AbortController(),to=setTimeout(()=>ctrl.abort(),25000);
  try{
    const res=await fetch('https://text.pollinations.ai/openai',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'openai',messages:msgs}),signal:ctrl.signal});
    if(!res.ok) throw new Error('pollinations '+res.status);
    const j=await res.json();
    return parseLLM((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'');
  } finally { clearTimeout(to); }
}
async function askGemini(text,key){
  const contents=[...chatHistory.slice(-6).map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.content}]})),
    {role:'user',parts:[{text:text}]}];
  const url='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+encodeURIComponent(key);
  const ctrl=new AbortController(),to=setTimeout(()=>ctrl.abort(),25000);
  try{
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({system_instruction:{parts:[{text:LLM_SYSTEM}]},contents,
        generationConfig:{maxOutputTokens:160,temperature:.9}}),signal:ctrl.signal});
    if(!res.ok) throw new Error('gemini '+res.status);
    const j=await res.json();
    return parseLLM((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts[0]&&j.candidates[0].content.parts[0].text)||'');
  } finally { clearTimeout(to); }
}
async function askLLM(text){
  try { return await askPollinations(text); }
  catch(e){ const k=getGeminiKey();
    if(k){ try{ return await askGemini(text,k); }catch(e2){} } throw e; }
}

let speaking=false,visemeTimer=null,voiceOn=true,volume=1,autoSendVoice=true;
function setViseme(v){ Face.viseme=v; Face.draw();
  clearTimeout(visemeTimer);
  visemeTimer=setTimeout(()=>{ Face.viseme=null; Face.draw(); },260); }
function speak(text,emotion){
  if(!voiceOn){
    if(['happy','laugh','love','sad','angry','sleepy','surprised','excited','wink','music'].includes(emotion)) Anim.set(emotion);
    else Anim.set('idle');
    setStatus('Online'); return;
  }
  try{
    speechSynthesis.cancel(); clearTimeout(visemeTimer); Face.viseme=null;
    const u=new SpeechSynthesisUtterance(text);
    u.lang='hi-IN'; u.rate=.95; u.pitch=1.3; u.volume=volume;
    const vs=speechSynthesis.getVoices();
    const hv=vs.find(v=>v.lang.startsWith('hi'))||vs.find(v=>v.lang.startsWith('en'));
    if(hv)u.voice=hv;
    u.onstart=()=>{ speaking=true; Anim.set('speaking'); setStatus('Speaking'); showState('speaking');
      $('stopBtn').classList.add('show');
      if(emotion&&emotion!=='speaking'){ Face.emotion=emotion; Face.draw(); } };
    u.onboundary=(ev)=>{ try{ const m=text.slice(ev.charIndex||0).match(/^\S+/);
      if(m) setViseme(wordViseme(m[0])); }catch(e){} };
    const done=()=>{ speaking=false; Face.viseme=null; clearTimeout(visemeTimer);
      hideState(); $('stopBtn').classList.remove('show');
      if(['happy','laugh','love','sad','angry','sleepy','surprised','excited','wink','music'].includes(emotion)) Anim.set(emotion);
      else Anim.set('idle');
      setStatus('Online'); Face.draw(); };
    u.onend=done;
    u.onerror=(ev)=>{ if(ev&&ev.error==='interrupted'){ done(); return; } done(); showError('Bol nahi payi'); };
    speechSynthesis.speak(u);
  }catch(e){ Anim.set('idle'); }
}
if('speechSynthesis' in window) speechSynthesis.getVoices();

function replyTo(text){
  addMsg(text,'user');
  Anim.set('thinking'); setStatus('Thinking'); showState('thinking');
  const quick=think(text);
  if(!FALLBACK.includes(quick.text)){
    setTimeout(()=>{ addMsg(quick.text,'ai'); pushHistory(text,quick.text);
      if(quick.act==='waving'){ Anim.set('waving'); }
      speak(quick.text,quick.e);
    },700+Math.random()*500);
    return;
  }
  askLLM(text).then(ans=>{ addMsg(ans.text,'ai'); pushHistory(text,ans.text); speak(ans.text,ans.emotion); })
  .catch(()=>{ const fb=FALLBACK[Math.floor(Math.random()*FALLBACK.length)];
    addMsg(fb+' (offline mode)','ai'); speak(fb,'thinking'); });
}

/* mic */
const micBtn=$('micBtn');
let rec=null,listening=false;
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ addMsg('Mic support nahi hai! Type karo na! 🥺','ai'); return; }
  if(speaking){ try{ speechSynthesis.cancel(); }catch(e){}
    speaking=false; Face.viseme=null; clearTimeout(visemeTimer); hideState(); }
  if(listening){ rec.stop(); return; }
  rec=new SR(); rec.lang='hi-IN'; rec.interimResults=false; rec.maxAlternatives=1;
  rec.onstart=()=>{ listening=true; micBtn.classList.add('listening');
    Anim.set('listening'); setStatus('Listening'); showState('listening'); };
  rec.onresult=e=>{ const txt=e.results[0][0].transcript; stopListen(); hideState();
    if(autoSendVoice) replyTo(txt);
    else { $('txtIn').value=txt; addMsg('🎙️ "'+txt+'" — edit karke ➤ dabao!','ai');
      Anim.set('idle'); setStatus('Online'); } };
  rec.onerror=()=>{ stopListen(); hideState(); showError('Sun nahi payi'); Anim.set('idle'); };
  rec.onend=()=>{ if(listening) stopListen(); };
  try{ speechSynthesis.cancel(); rec.start(); }catch(e){}
}
function stopListen(){ listening=false; micBtn.classList.remove('listening'); }
micBtn.onclick=toggleMic;
$('stopBtn').onclick=()=>{ try{ speechSynthesis.cancel(); }catch(e){}
  setTimeout(()=>{ if(speaking){ speaking=false; Face.viseme=null; hideState();
    $('stopBtn').classList.remove('show'); Anim.set('idle'); setStatus('Online'); Face.draw(); } },400); };
$('sendBtn').onclick=()=>{ const v=$('txtIn').value.trim(); if(v){ $('txtIn').value=''; replyTo(v); } };
$('txtIn').addEventListener('keydown',e=>{ if(e.key==='Enter') $('sendBtn').click(); });

/* tabs + settings */
const tabC=$('tabChat'),tabS=$('tabSettings'),setP=$('settings'),msgsEl=$('msgs'),chatWrap=$('chatWrap');
$('tabVoice').onclick=()=>{ toggleMic(); };
tabC.onclick=()=>{ const on=tabC.classList.toggle('on');
  chatWrap.style.display=on?'flex':'none'; };
tabS.onclick=()=>{ const on=setP.classList.toggle('show'); tabS.classList.toggle('on',on); };
$('tglVoice').onclick=e=>{ voiceOn=e.target.classList.toggle('on'); };
$('tglAutoSend').onclick=e=>{ autoSendVoice=e.target.classList.toggle('on'); };
$('volRange').oninput=e=>{ volume=e.target.value/100; };
$('clearChat').onclick=()=>{ msgsEl.innerHTML=''; };
{ const ki=$('keyIn'),ks=$('keyStatus');

/* tap head = boop */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{
  const r=renderer.domElement.getBoundingClientRect();
  ptr.x=((e.clientX-r.left)/r.width)*2-1; ptr.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ptr,camera);
  if(ray.intersectObject(headG,true).length&&!speaking){
    addMsg('Hehe! Boop! 🥰','ai'); speak('Hehe! Boop!','wink');
  }
});

/* ================= LOOP ================= */
addEventListener('resize',fitStage);
const clock=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  Anim.update(dt,t);
  composer.render();
  if(!window.__mimiReady){ window.__mimiReady=true; }
})();
fitStage();

/* greeting */
setTimeout(()=>{
  Anim.set('love');
  const g="Namaste! Main Mimi hun! Tumhari cute robot dost! Mic dabao aur mujhse kuch bhi pucho!";
  addMsg(g,'ai'); speak(g,'love');
},1200);
