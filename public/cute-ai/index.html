<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Mimi 🤖 — Your Cute 3D AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; }
  body { background:
    radial-gradient(ellipse 80% 55% at 50% 30%, rgba(139,92,246,.28) 0%, transparent 60%),
    radial-gradient(ellipse 60% 45% at 18% 65%, rgba(219,39,119,.16) 0%, transparent 60%),
    radial-gradient(ellipse 60% 45% at 85% 60%, rgba(56,189,248,.14) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 35%,#232347 0%,#12122b 60%,#0a0a18 100%); color:#fff; }
  #scene { position:fixed; inset:0; }
  #hdr { position:fixed; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; z-index:10; pointer-events:none; }
  #hdr .name { font-size:22px; font-weight:800; letter-spacing:.5px;
    background:linear-gradient(90deg,#7dd3fc,#c084fc,#f9a8d4); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #status { font-size:13px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2);
    padding:6px 14px; border-radius:20px; backdrop-filter:blur(8px); }
  #status .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#4ade80; margin-right:6px;
    animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  #chat { position:fixed; left:0; right:0; bottom:0; z-index:10; display:flex; flex-direction:column;
    max-height:40%; pointer-events:none; }
  #msgs { overflow-y:auto; padding:10px 16px; display:flex; flex-direction:column; gap:8px; pointer-events:auto;
    mask-image:linear-gradient(to bottom,transparent,#000 15%); -webkit-mask-image:linear-gradient(to bottom,transparent,#000 15%); }
  .msg { max-width:82%; padding:10px 14px; border-radius:18px; font-size:14.5px; line-height:1.45;
    animation:pop .3s ease; word-wrap:break-word; }
  @keyframes pop { from{transform:scale(.9);opacity:0} to{transform:scale(1);opacity:1} }
  .msg.ai { align-self:flex-start; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18);
    border-bottom-left-radius:6px; backdrop-filter:blur(8px); }
  .msg.user { align-self:flex-end; background:linear-gradient(135deg,#7c3aed,#4f46e5);
    border-bottom-right-radius:6px; }
  #ctrl { display:flex; align-items:center; gap:10px; padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    pointer-events:auto; background:linear-gradient(to top,rgba(10,10,30,.85),transparent); }
  #micBtn { width:64px; height:64px; border-radius:50%; border:none; cursor:pointer; flex-shrink:0;
    background:linear-gradient(135deg,#f472b6,#a855f7); font-size:28px; color:#fff;
    box-shadow:0 4px 20px rgba(244,114,182,.5); transition:transform .15s; }
  #micBtn:active { transform:scale(.92); }
  #micBtn.listening { animation:micpulse 1s infinite; background:linear-gradient(135deg,#ef4444,#f97316); }
  @keyframes micpulse { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.6)} 50%{box-shadow:0 0 0 18px rgba(239,68,68,0)} }
  #txtIn { flex:1; padding:14px 18px; border-radius:28px; border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.1); color:#fff; font-size:15px; outline:none; backdrop-filter:blur(8px); }
  #txtIn::placeholder { color:rgba(255,255,255,.5); }
  #sendBtn { width:52px; height:52px; border-radius:50%; border:none; cursor:pointer; flex-shrink:0;
    background:linear-gradient(135deg,#38bdf8,#6366f1); font-size:22px; color:#fff; }
  #hint { text-align:center; font-size:12px; color:rgba(255,255,255,.55); padding:0 0 8px; pointer-events:none; }
  /* state bar with waveform (listening / thinking / speaking) */
  #stateBar { display:none; align-items:center; justify-content:center; gap:10px; z-index:10;
    margin:0 auto 8px; padding:10px 22px; border-radius:28px; pointer-events:none;
    background:rgba(99,102,241,.18); border:1px solid rgba(139,92,246,.45);
    backdrop-filter:blur(10px); font-size:14px; font-weight:600; width:max-content; max-width:88vw; }
  #stateBar.show { display:flex; animation:pop .25s ease; }
  .wave { display:flex; align-items:center; gap:3px; height:22px; }
  .wave span { width:4px; border-radius:3px; background:linear-gradient(#7dd3fc,#c084fc); }
  .wave.play span { animation:wv .7s ease-in-out infinite; }
  .wave.play span:nth-child(1){height:8px;animation-delay:0s}
  .wave.play span:nth-child(2){height:16px;animation-delay:.12s}
  .wave.play span:nth-child(3){height:22px;animation-delay:.24s}
  .wave.play span:nth-child(4){height:14px;animation-delay:.36s}
  .wave.play span:nth-child(5){height:8px;animation-delay:.48s}
  @keyframes wv { 0%,100%{transform:scaleY(.4)} 50%{transform:scaleY(1)} }
  .tdots span { display:inline-block; width:7px; height:7px; border-radius:50%; background:#c084fc; margin:0 2px;
    animation:tblink 1.2s infinite; }
  .tdots span:nth-child(2){animation-delay:.2s} .tdots span:nth-child(3){animation-delay:.4s}
  @keyframes tblink { 0%,100%{opacity:.25;transform:translateY(0)} 50%{opacity:1;transform:translateY(-4px)} }
  /* bottom tabs */
  #tabs { display:flex; justify-content:center; gap:6px; padding:8px 16px 0; pointer-events:auto; z-index:10; }
  #tabs button { flex:1; max-width:130px; padding:9px 0; border-radius:14px; border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.07); color:rgba(255,255,255,.75); font-size:13px; font-weight:600; cursor:pointer; }
  #tabs button.on { background:linear-gradient(135deg,rgba(168,85,247,.5),rgba(99,102,241,.5));
    color:#fff; border-color:rgba(196,132,252,.6); }
  /* settings panel */
  #settings { display:none; margin:8px 16px 0; padding:14px 16px; border-radius:16px; z-index:10; pointer-events:auto;
    background:rgba(20,20,45,.85); border:1px solid rgba(139,92,246,.4); backdrop-filter:blur(10px); font-size:14px; }
  #settings.show { display:block; }
  #settings .row { display:flex; align-items:center; justify-content:space-between; padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,.08); }
  #settings .row:last-child { border:none; }
  .tgl { width:52px; height:28px; border-radius:15px; border:none; cursor:pointer; position:relative;
    background:#4c1d95; transition:background .2s; }
  .tgl.on { background:linear-gradient(135deg,#a855f7,#6366f1); }
  .tgl::after { content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
    background:#fff; transition:left .2s; }
  .tgl.on::after { left:27px; }
  #clearChat { padding:8px 18px; border-radius:12px; border:1px solid rgba(248,113,113,.5);
    background:rgba(248,113,113,.15); color:#fca5a5; font-size:13px; cursor:pointer; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="scene"></div>
<div id="hdr">
  <div class="name">✨ Mimi <span style="font-size:12px;font-weight:400;opacity:.7;-webkit-text-fill-color:rgba(255,255,255,.7)">Your AI companion</span></div>
  <div id="status"><span class="dot"></span><span id="statusTxt">Online</span></div>
</div>
<div id="chat">
  <div id="stateBar"><div class="wave" id="waveBars"><span></span><span></span><span></span><span></span><span></span></div><span id="stateTxt">Listening...</span></div>
  <div id="msgs"></div>
  <div id="hint">🎙️ Mic dabao aur bolo — ya type karo!</div>
  <div id="settings">
    <div class="row"><span>🔊 Voice jawab</span><button class="tgl on" id="tglVoice"></button></div>
    <div class="row"><span>💬 Chat saaf karo</span><button id="clearChat">Clear</button></div>
  </div>
  <div id="tabs">
    <button id="tabVoice" class="on">✨ Voice</button>
    <button id="tabChat" class="on">💬 Chat</button>
    <button id="tabSettings">⚙️ Settings</button>
  </div>
  <div id="msgs"></div>
  <div id="hint">🎙️ Mic dabao aur bolo — ya type karo!</div>
  <div id="ctrl">
    <button id="micBtn" title="Bolo">🎙️</button>
    <input id="txtIn" placeholder="Mimi se kuch kaho..." autocomplete="off"/>
    <button id="sendBtn" title="Bhejo">➤</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ================= SCENE ================= */
const container=document.getElementById('scene');
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0a0a18,16,36);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,100);
camera.position.set(0,.6,9.2); camera.lookAt(0,.1,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
container.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x99aaff,.75));
const key=new THREE.DirectionalLight(0xffffff,1.15); key.position.set(4,7,6); scene.add(key);
const rimL=new THREE.DirectionalLight(0x38bdf8,.7); rimL.position.set(-6,3,-2); scene.add(rimL);
const rimR=new THREE.DirectionalLight(0xc084fc,.5); rimR.position.set(6,2,-3); scene.add(rimR);
const glow=new THREE.PointLight(0x38bdf8,2,7); glow.position.set(0,-.6,2); scene.add(glow);

/* particles */
{
  const g=new THREE.BufferGeometry(),p=[];
  for(let i=0;i<220;i++)p.push((Math.random()-.5)*26,Math.random()*12-3,(Math.random()-.5)*20-4);
  g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x7dd3fc,size:.1,transparent:true,opacity:.6})));
}
/* ground glow */
{
  const d=new THREE.Mesh(new THREE.CircleGeometry(2.6,48),
    new THREE.MeshBasicMaterial({color:0x2563eb,transparent:true,opacity:.16}));
  d.rotation.x=-Math.PI/2; d.position.y=-1.9; scene.add(d);
}

/* ================= LED FACE (low-res canvas = dot-matrix look) ================= */
const FC=168; // low res for LED pixelation
const faceCanvas=document.createElement('canvas');
faceCanvas.width=faceCanvas.height=FC;
const fx=faceCanvas.getContext('2d');
fx.imageSmoothingEnabled=false;
const faceTex=new THREE.CanvasTexture(faceCanvas);
faceTex.colorSpace=THREE.SRGBColorSpace;
faceTex.magFilter=THREE.NearestFilter; faceTex.minFilter=THREE.NearestFilter;

const Face={
  emotion:'normal', mouthOpen:0, viseme:null, lookX:0, lookY:0, blinkT:2, tearT:0,
  draw(){
    const c=fx,S=FC;
    c.clearRect(0,0,S,S);
    c.fillStyle='#04040c'; c.fillRect(0,0,S,S);
    // vignette glow
    const vg=c.createRadialGradient(S/2,S/2,10,S/2,S/2,S*.75);
    vg.addColorStop(0,'rgba(40,90,160,0.25)'); vg.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=vg; c.fillRect(0,0,S,S);

    const E=this.emotion;
    const blue=E==='angry'?'#ff5a5a':'#6ee7ff';
    const dim ='#1e6f8e';
    const ex1=S*.31+this.lookX*8, ex2=S*.69+this.lookX*8;
    const ey=S*.46+this.lookY*7;
    c.lineCap='round';

    const glowEye=(fn)=>{ c.save(); c.shadowColor=blue; c.shadowBlur=14; c.fillStyle=blue; c.strokeStyle=blue; fn(); c.restore(); };

    /* ---- brows ---- */
    const brow=(x,flip,lift,angry)=>{
      c.save(); c.shadowColor=blue; c.shadowBlur=8; c.strokeStyle=blue; c.lineWidth=5;
      c.beginPath();
      if(angry) c.moveTo(x-16,ey-38+lift),c.lineTo(x+16,ey-26+lift);
      else c.arc(x,ey-30+lift,17,Math.PI*1.18,Math.PI*1.82);
      c.stroke(); c.restore();
    };
    const browLift = E==='surprised'?-8 : E==='sad'?6 : E==='happy'?-4 : 0;
    if(E!=='sleepy'&&E!=='blink'){ brow(ex1,false,browLift,E==='angry'); brow(ex2,true,browLift,E==='angry'); }

    /* ---- eyes ---- */
    const eyeW=30, eyeH=36;
    if(E==='blink'||E==='sleepy'){
      glowEye(()=>{ c.lineWidth=7;
        c.beginPath(); c.moveTo(ex1-eyeW/2,ey); c.quadraticCurveTo(ex1,ey+(E==='sleepy'?10:4),ex1+eyeW/2,ey); c.stroke();
        c.beginPath(); c.moveTo(ex2-eyeW/2,ey); c.quadraticCurveTo(ex2,ey+(E==='sleepy'?10:4),ex2+eyeW/2,ey); c.stroke();
      });
    } else if(E==='happy'){ // ^ ^
      glowEye(()=>{ c.lineWidth=9;
        c.beginPath(); c.arc(ex1,ey+12,20,Math.PI*1.12,Math.PI*1.88); c.stroke();
        c.beginPath(); c.arc(ex2,ey+12,20,Math.PI*1.12,Math.PI*1.88); c.stroke();
      });
    } else if(E==='excited'){ // star eyes
      const star=(x,y,r)=>{
        c.beginPath();
        for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.45:r;
          c[i?'lineTo':'moveTo'](x+Math.cos(a)*rr,y+Math.sin(a)*rr); }
        c.closePath(); c.fill();
      };
      glowEye(()=>{ star(ex1,ey,24); star(ex2,ey,24); });
    } else if(E==='love'){
      const heart=(x,y,s)=>{
        c.beginPath(); c.moveTo(x,y+s*.9);
        c.bezierCurveTo(x-s*1.4,y+s*.1,x-s*.9,y-s*.9,x,y-s*.25);
        c.bezierCurveTo(x+s*.9,y-s*.9,x+s*1.4,y+s*.1,x,y+s*.9); c.fill();
      };
      c.save(); c.shadowColor='#ff7ab8'; c.shadowBlur=14; c.fillStyle='#ff8ac2';
      heart(ex1,ey,15); heart(ex2,ey,15); c.restore();
    } else if(E==='sad'){
      glowEye(()=>{
        // droopy eyes
        c.beginPath(); c.ellipse(ex1,ey+4,eyeW/2,eyeH/2,0,0,Math.PI*2); c.fill();
        c.beginPath(); c.ellipse(ex2,ey+4,eyeW/2,eyeH/2,0,0,Math.PI*2); c.fill();
      });
      // tears (animated)
      const ty=(this.tearT*40)%44;
      c.save(); c.shadowColor=blue; c.shadowBlur=10; c.fillStyle=blue;
      for(const tx of [ex1,ex2]){
        c.beginPath(); c.ellipse(tx,ey+22+ty,5,8,0,0,Math.PI*2); c.fill();
        c.beginPath(); c.ellipse(tx,ey+20,9,5,0,0,Math.PI*2); c.fill(); // puddle
      }
      c.restore();
    } else if(E==='angry'){
      glowEye(()=>{
        c.beginPath(); // angled top
        c.moveTo(ex1-16,ey-14); c.lineTo(ex1+16,ey-20); c.lineTo(ex1+14,ey+14);
        c.quadraticCurveTo(ex1,ey+20,ex1-14,ey+14); c.closePath(); c.fill();
        c.beginPath();
        c.moveTo(ex2-16,ey-20); c.lineTo(ex2+16,ey-14); c.lineTo(ex2+14,ey+14);
        c.quadraticCurveTo(ex2,ey+20,ex2-14,ey+14); c.closePath(); c.fill();
      });
    } else if(E==='surprised'){
      glowEye(()=>{
        c.lineWidth=8;
        c.beginPath(); c.arc(ex1,ey,20,0,Math.PI*2); c.stroke();
        c.beginPath(); c.arc(ex2,ey,20,0,Math.PI*2); c.stroke();
        c.beginPath(); c.arc(ex1,ey,6,0,Math.PI*2); c.fill();
        c.beginPath(); c.arc(ex2,ey,6,0,Math.PI*2); c.fill();
      });
    } else if(E==='thinking'){
      glowEye(()=>{
        c.beginPath(); c.ellipse(ex1-6,ey-8,16,20,0,0,Math.PI*2); c.fill();
        c.beginPath(); c.ellipse(ex2-6,ey-8,16,20,0,0,Math.PI*2); c.fill();
        c.shadowBlur=0; c.fillStyle='#04040c';
        c.beginPath(); c.arc(ex1-2,ey-12,7,0,Math.PI*2); c.fill();
        c.beginPath(); c.arc(ex2-2,ey-12,7,0,Math.PI*2); c.fill();
      });
    } else if(E==='wink'){
      glowEye(()=>{
        c.beginPath(); c.ellipse(ex1,ey,eyeW/2,eyeH/2,0,0,Math.PI*2); c.fill();
        c.shadowBlur=0; c.fillStyle='#e8fbff';
        c.beginPath(); c.arc(ex1+4,ey-6,6,0,Math.PI*2); c.fill();
        c.shadowColor=blue; c.shadowBlur=14; c.strokeStyle=blue; c.lineWidth=8;
        c.beginPath(); c.arc(ex2,ey+6,18,Math.PI*1.15,Math.PI*1.85); c.stroke();
      });
    } else { // normal
      glowEye(()=>{
        c.beginPath(); c.ellipse(ex1,ey,eyeW/2,eyeH/2,0,0,Math.PI*2); c.fill();
        c.beginPath(); c.ellipse(ex2,ey,eyeW/2,eyeH/2,0,0,Math.PI*2); c.fill();
        c.shadowBlur=0; c.fillStyle='#e8fbff';
        c.beginPath(); c.arc(ex1+5,ey-8,7,0,Math.PI*2); c.fill();
        c.beginPath(); c.arc(ex2+5,ey-8,7,0,Math.PI*2); c.fill();
      });
    }

    /* ---- mouth: viseme-driven when speaking, else emotion ---- */
    const mx=S/2, my=S*.74;
    c.save(); c.shadowColor=E==='angry'?'#ff5a5a':'#7dd3fc'; c.shadowBlur=12;
    c.strokeStyle=E==='angry'?'#ff5a5a':'#7dd3fc';
    c.fillStyle=E==='angry'?'#ff5a5a':'#7dd3fc'; c.lineWidth=6;
    const V=this.viseme; // real lip-sync: open|spread|round|closed|teeth
    if(V){
      if(V==='closed'){ c.beginPath(); c.moveTo(mx-12,my); c.lineTo(mx+12,my); c.stroke(); }
      else if(V==='round'){ c.beginPath(); c.ellipse(mx,my,9,11,0,0,Math.PI*2); c.stroke(); }
      else if(V==='spread'){ c.beginPath(); c.ellipse(mx,my,17,6,0,0,Math.PI*2); c.stroke(); }
      else if(V==='teeth'){ c.beginPath(); c.ellipse(mx,my,12,5,0,0,Math.PI*2); c.stroke();
        c.beginPath(); c.moveTo(mx-12,my); c.lineTo(mx+12,my); c.stroke(); }
      else { c.beginPath(); c.ellipse(mx,my,12,17,0,0,Math.PI*2); c.fill(); } // open
    } else if(this.mouthOpen>0.06){
      const mh=4+this.mouthOpen*20, mw=10+this.mouthOpen*10;
      c.beginPath(); c.ellipse(mx,my,mw,mh,0,0,Math.PI*2); c.fill();
    } else if(E==='happy'||E==='excited'){
      c.beginPath(); c.arc(mx,my-8,16,Math.PI*.12,Math.PI*.88); c.stroke();
      if(E==='excited'){ c.beginPath(); c.ellipse(mx,my+6,13,9,0,0,Math.PI*2); c.fill(); }
    } else if(E==='sad'||E==='angry'){
      c.beginPath(); c.arc(mx,my+16,14,Math.PI*1.15,Math.PI*1.85); c.stroke();
    } else if(E==='surprised'){
      c.beginPath(); c.ellipse(mx,my,9,12,0,0,Math.PI*2); c.stroke();
    } else if(E==='thinking'){
      c.font='bold 22px monospace'; c.textAlign='center'; c.fillText('3',mx,my+8);
    } else if(E==='sleepy'){
      c.beginPath(); c.moveTo(mx-10,my); c.lineTo(mx+10,my); c.stroke();
    } else if(E==='love'||E==='wink'){
      c.beginPath(); c.arc(mx,my-6,13,Math.PI*.15,Math.PI*.85); c.stroke();
    } else {
      c.beginPath(); c.arc(mx,my-4,11,Math.PI*.2,Math.PI*.8); c.stroke();
    }
    c.restore();
    faceTex.needsUpdate=true;
  }
};
Face.draw();

/* ================= ROBOT HEAD (no body!) ================= */
const robot=new THREE.Group(); scene.add(robot);
robot.scale.setScalar(0.72); // compact size like reference images
const headG=new THREE.Group(); robot.add(headG);

const frameMat=new THREE.MeshStandardMaterial({color:0xeef2f7,roughness:.28,metalness:.15});
const headMesh=new THREE.Mesh(new RoundedBoxGeometry(2.5,2.15,2.1,5,.5),frameMat);
headG.add(headMesh);
/* dark screen */
const screenMesh=new THREE.Mesh(new RoundedBoxGeometry(2.16,1.82,0.5,4,.32),
  new THREE.MeshStandardMaterial({color:0x05050c,roughness:.35,metalness:.4}));
screenMesh.position.z=.82; headG.add(screenMesh);
/* LED face plane */
const faceMesh=new THREE.Mesh(new THREE.PlaneGeometry(2.0,1.68),
  new THREE.MeshBasicMaterial({map:faceTex,transparent:true}));
faceMesh.position.z=1.09; headG.add(faceMesh);
/* ears */
for(const s of [-1,1]){
  const ear=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.3,28),
    new THREE.MeshStandardMaterial({color:0x1e3a5f,roughness:.4}));
  ear.rotation.z=Math.PI/2; ear.position.set(s*1.28,0,0); headG.add(ear);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.2,.05,12,32),
    new THREE.MeshBasicMaterial({color:0x38bdf8}));
  ring.rotation.y=Math.PI/2; ring.position.set(s*1.45,0,0); headG.add(ring);
  const dot=new THREE.Mesh(new THREE.CircleGeometry(.13,24),
    new THREE.MeshBasicMaterial({color:0x0a2540}));
  dot.rotation.y=s*Math.PI/2; dot.position.set(s*1.44,0,0); headG.add(dot);
}

/* floating emotion symbols (?, zzz, !, notes) */
function symTex(txt,color){
  const cv=document.createElement('canvas'); cv.width=cv.height=128;
  const g=cv.getContext('2d'); g.font='bold 84px sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.shadowColor=color; g.shadowBlur=22; g.fillStyle=color; g.fillText(txt,64,70);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const symMats={
  '?':new THREE.SpriteMaterial({map:symTex('?','#6ee7ff'),transparent:true,depthWrite:false}),
  'z':new THREE.SpriteMaterial({map:symTex('z','#6ee7ff'),transparent:true,depthWrite:false}),
  '!':new THREE.SpriteMaterial({map:symTex('!','#6ee7ff'),transparent:true,depthWrite:false}),
  '♪':new THREE.SpriteMaterial({map:symTex('♪','#6ee7ff'),transparent:true,depthWrite:false}),
};
const sym=new THREE.Sprite(symMats['?']); sym.scale.setScalar(.8);
sym.position.set(1.7,1.7,0); sym.visible=false; robot.add(sym);
const sym2=new THREE.Sprite(symMats['z']); sym2.scale.setScalar(.55);
sym2.position.set(-1.5,1.9,0); sym2.visible=false; robot.add(sym2);
function showSym(s){
  sym.visible=!!s; sym2.visible=(s==='z');
  if(s&&symMats[s]) sym.material=symMats[s];
}

/* ================= ANIMATION ================= */
const Anim={
  state:'idle', t:0, tilt:0, tiltT:0, lean:0, leanT:0,
  set(s){ this.state=s; this.t=0;
    this.tiltT=0; this.leanT=0; showSym(null);
    if(s==='greeting'){ Face.emotion='happy'; }
    if(s==='listening'){ Face.emotion='surprised'; this.leanT=.1; }
    if(s==='thinking'){ Face.emotion='thinking'; this.tiltT=.22; Face.lookY=-.6; showSym('?'); }
    if(s==='speaking'){ Face.emotion='normal'; this.leanT=.05; }
    if(s==='happy'){ Face.emotion='happy'; }
    if(s==='idle'){ Face.emotion='normal'; Face.lookY=0; }
    if(s==='love'){ Face.emotion='love'; }
    if(s==='sad'){ Face.emotion='sad'; this.tiltT=-.14; }
    if(s==='angry'){ Face.emotion='angry'; this.leanT=.14; }
    if(s==='sleepy'){ Face.emotion='sleepy'; showSym('z'); }
    if(s==='surprised'){ Face.emotion='surprised'; showSym('!'); }
    if(s==='excited'){ Face.emotion='excited'; showSym('!'); }
    if(s==='wink'){ Face.emotion='wink'; }
    if(s==='music'){ Face.emotion='happy'; showSym('♪'); }
    Face.draw();
  },
  update(dt,time){
    this.t+=dt;
    // anti-gravity float
    const hop=(this.state==='happy'||this.state==='excited')?Math.abs(Math.sin(this.t*6))*.35:0;
    const sadDip=this.state==='sad'?-.12:0;
    headG.position.y=Math.sin(time*1.7)*.13+hop+sadDip;
    headG.rotation.y=Math.sin(time*.55)*.14+(this.state==='thinking'?Math.sin(time*2)*.06:0);
    robot.rotation.z=Math.sin(time*.8)*.03;
    // sleepy: slow sink + sway
    if(this.state==='sleepy'){ headG.rotation.z=Math.sin(time*.9)*.12; headG.position.y-=.15; }
    else headG.rotation.z*=.9;
    this.tilt+=(this.tiltT-this.tilt)*Math.min(1,dt*5);
    this.lean+=(this.leanT-this.lean)*Math.min(1,dt*5);
    headG.rotation.x=this.lean;
    // tilt head sideways for thinking
    headG.rotation.z+= (this.tilt-headG.rotation.z)*Math.min(1,dt*5)*.0; // keep simple
    // blink
    Face.blinkT-=dt;
    if(Face.blinkT<=0&&['idle','normal'].includes(this.state)||Face.blinkT<=0&&Face.emotion==='normal'){
      const k=Face.emotion; Face.emotion='blink'; Face.draw();
      setTimeout(()=>{Face.emotion=k;Face.draw();},130);
      Face.blinkT=2.2+Math.random()*2.8;
    }
    // idle look
    if(this.state==='idle'&&Math.random()<dt*.3){
      Face.lookX=(Math.random()-.5)*1.1; Face.lookY=(Math.random()-.5)*.5; Face.draw();
    }
    // sad tears anim
    if(Face.emotion==='sad'){ Face.tearT+=dt; Face.draw(); }
    // speaking mouth
    if(this.state==='speaking'&&!speaking){ Face.mouthOpen=0; }
    // halo
    halo.rotation.z+=dt*1.1; halo2.rotation.z-=dt*.7;
    halo.material.opacity=this.state==='listening'?.85+Math.sin(time*9)*.2:.55;
    // symbols bob
    if(sym.visible){ sym.position.y=1.7+Math.sin(time*3)*.12; }
    if(sym2.visible){ sym2.position.y=1.9+Math.sin(time*2.2)*.1; }
  }
};

const FALLBACK=["Hmm! 🤔 Kuch aur pucho na!","Samajh nahi aaya! 🥺 Phir se bolo?","Interesting! ✨ Aur batao!"];
function think(text){
  const t=' '+text.toLowerCase()+' ';
  for(const b of BRAIN) if(b.k.some(k=>t.includes(k)))
    return {text:b.r[Math.floor(Math.random()*b.r.length)],e:b.e||'happy',act:b.act};
  return {text:FALLBACK[Math.floor(Math.random()*FALLBACK.length)],e:'thinking'};
}

/* ================= VISIME LIP-SYNC (phoneme -> mouth shape) ================= */
const PHONEME_VIS={
  // Hindi vowels -> mouth shapes
  'अ':'open','आ':'open','ा':'open','ऑ':'open','ॉ':'open',
  'इ':'spread','ई':'spread','ि':'spread','ी':'spread',
  'उ':'round','ऊ':'round','ु':'round','ू':'round',
  'ए':'spread','े':'spread','ऐ':'spread','ै':'spread',
  'ओ':'round','ो':'round','औ':'round','ौ':'round',
  'अं':'open','ं':'open','ँ':'open','ः':'open','ऋ':'spread','ृ':'spread',
  // Hindi consonants: lips close for m/b/p, teeth for f/v/s
  'म':'closed','भ':'closed','ब':'closed','प':'closed',
  'फ':'teeth','व':'teeth','स':'teeth','श':'teeth','ष':'teeth','ज':'teeth','झ':'teeth','च':'teeth','छ':'teeth',
  // English vowels
  'a':'open','e':'spread','i':'spread','o':'round','u':'round','y':'spread',
  // English consonants
  'm':'closed','b':'closed','p':'closed','f':'teeth','v':'teeth','s':'teeth',
};
function wordViseme(word){
  const w=word.toLowerCase();
  // pass 1: prefer vowel shapes (most visible in speech)
  for(const ch of w){ const v=PHONEME_VIS[ch];
    if(v==='open'||v==='round'||v==='spread') return v; }
  // pass 2: consonant shapes
  for(const ch of w){ const v=PHONEME_VIS[ch]; if(v) return v; }
  return 'open';
}

/* ================= VOICE ================= */
let speaking=false, visemeTimer=null;
function setViseme(v){
  Face.viseme=v; Face.draw();
  clearTimeout(visemeTimer);
  visemeTimer=setTimeout(()=>{ Face.viseme=null; Face.draw(); }, 260);
}
let voiceOn=true;
function speak(text,emotion){
  if(!voiceOn){ // text only
    if(emotion&&['happy','love','sad','angry','sleepy','surprised','excited','wink','music'].includes(emotion)) Anim.set(emotion);
    else Anim.set('idle');
    setStatus('Online'); return;
  }
  try{
    speechSynthesis.cancel();
    clearTimeout(visemeTimer); Face.viseme=null;
    const u=new SpeechSynthesisUtterance(text);
    u.lang='hi-IN'; u.rate=.95; u.pitch=1.3;
    const vs=speechSynthesis.getVoices();
    const hv=vs.find(v=>v.lang.startsWith('hi'))||vs.find(v=>v.lang.startsWith('en'));
    if(hv)u.voice=hv;
    u.onstart=()=>{ speaking=true; Anim.set('speaking'); setStatus('bol rahi hun... 🗣️'); showState('speaking');
      if(emotion&&emotion!=='speaking'){Face.emotion=emotion;Face.draw();} };
    // REAL lip-sync: each spoken word -> its phoneme mouth shape
    u.onboundary=(ev)=>{
      try{
        const idx=ev.charIndex||0;
        const rest=text.slice(idx);
        const m=rest.match(/^\S+/);
        if(m){ setViseme(wordViseme(m[0])); }
      }catch(e){}
    };
    const done=()=>{ speaking=false; Face.mouthOpen=0; Face.viseme=null; clearTimeout(visemeTimer);
      hideState();
      if(emotion&&['happy','love','sad','angry','sleepy','surprised','excited','wink','music'].includes(emotion))
        Anim.set(emotion); else Anim.set('idle');
      setStatus('Online'); Face.draw(); };
    u.onend=done; u.onerror=done;
    speechSynthesis.speak(u);
  }catch(e){ Anim.set('idle'); }
}
if('speechSynthesis' in window)speechSynthesis.getVoices();

function replyTo(text){
  addMsg(text,'user');
  Anim.set('thinking'); setStatus('soch rahi hun... 🤔'); showState('thinking');
  setTimeout(()=>{
    const ans=think(text);
    addMsg(ans.text,'ai');
    if(ans.act==='greeting'){ Anim.set('greeting'); setTimeout(()=>Anim.set('idle'),1800); }
    speak(ans.text,ans.e);
  },700+Math.random()*500);
}

const micBtn=$('micBtn');
let rec=null,listening=false;
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ addMsg('Mic support nahi hai! Type karo na! 🥺','ai'); return; }
  // INTERRUPT: agar Mimi bol rahi hai to roko aur suno
  if(speaking){ try{ speechSynthesis.cancel(); }catch(e){}
    speaking=false; Face.viseme=null; Face.mouthOpen=0; clearTimeout(visemeTimer); hideState(); }
  if(listening){ rec.stop(); return; }
  rec=new SR(); rec.lang='hi-IN'; rec.interimResults=false; rec.maxAlternatives=1;
  rec.onstart=()=>{ listening=true; micBtn.classList.add('listening');
    Anim.set('listening'); setStatus('sun rahi hun... 👂'); showState('listening'); };
  rec.onresult=e=>{ const txt=e.results[0][0].transcript; stopListen(); hideState(); replyTo(txt); };
  rec.onerror=()=>{ stopListen(); hideState(); addMsg('Sun nahi payi! 🥺 Phir bolo!','ai'); Anim.set('idle'); setStatus('Online'); };
  rec.onend=()=>{ if(listening)stopListen(); };
  try{ speechSynthesis.cancel(); rec.start(); }catch(e){}
}
function stopListen(){ listening=false; micBtn.classList.remove('listening'); }
micBtn.onclick=toggleMic;

const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{

  }
});
