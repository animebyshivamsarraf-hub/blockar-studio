<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b34"/>
      <stop offset="1" stop-color="#070b18"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- side speakers -->
  <rect x="42" y="196" width="34" height="120" rx="15" fill="#1d4ed8"/>
  <rect x="42" y="196" width="34" height="120" rx="15" fill="none" stroke="#38bdf8" stroke-width="7" filter="url(#glow)"/>
  <rect x="436" y="196" width="34" height="120" rx="15" fill="#1d4ed8"/>
  <rect x="436" y="196" width="34" height="120" rx="15" fill="none" stroke="#38bdf8" stroke-width="7" filter="url(#glow)"/>
  <!-- white casing -->
  <rect x="66" y="106" width="380" height="300" rx="90" fill="#f4f7ff"/>
  <!-- black screen -->
  <rect x="100" y="136" width="312" height="240" rx="60" fill="#04040c"/>
  <!-- eyes -->
  <g filter="url(#glow)">
    <circle cx="196" cy="236" r="44" fill="none" stroke="#38bdf8" stroke-width="13"/>
    <circle cx="196" cy="236" r="44" fill="none" stroke="#eafcff" stroke-width="6"/>
    <circle cx="316" cy="236" r="44" fill="none" stroke="#38bdf8" stroke-width="13"/>
    <circle cx="316" cy="236" r="44" fill="none" stroke="#eafcff" stroke-width="6"/>
  </g>
  <!-- two highlight dots per eye -->
  <circle cx="209" cy="219" r="10.5" fill="#eafcff"/>
  <circle cx="219" cy="230" r="4.4" fill="#eafcff"/>
  <circle cx="329" cy="219" r="10.5" fill="#eafcff"/>
  <circle cx="339" cy="230" r="4.4" fill="#eafcff"/>
  <!-- brows -->
  <g stroke="#7dd3fc" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#glow)">
    <path d="M 172 176 A 30 30 0 0 1 220 176"/>
    <path d="M 292 176 A 30 30 0 0 1 340 176"/>
  </g>
  <!-- smile -->
  <path d="M 222 300 A 34 34 0 0 0 290 300" stroke="#7dd3fc" stroke-width="9" stroke-linecap="round" fill="none" filter="url(#glow)"/>
</svg>
